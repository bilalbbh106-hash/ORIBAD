<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إضافة منتج - ORIBAD</title>
    <link rel="stylesheet" href="../css/style.css">
    <link rel="stylesheet" href="../css/admin.css">
    <link rel="stylesheet" href="../css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- ====== الهيدر ====== -->
    <header>
        <div class="container header-container">
            <div class="logo-banner" style="padding: 8px 20px;">
                <h1 class="logo-text" style="font-size: 1.5rem;">ORIBAD</h1>
                <span class="logo-sub" style="font-size: 0.6rem;">لوحة التحكم</span>
            </div>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="dashboard.html"><i class="fas fa-chart-pie"></i> الرئيسية</a></li>
                    <li><a href="add-product.html" class="active"><i class="fas fa-plus-circle"></i> إضافة منتج</a></li>
                    <li><a href="manage-orders.html"><i class="fas fa-truck"></i> الطلبات</a></li>
                    <li><a href="manage-notifications.html"><i class="fas fa-bell"></i> الإشعارات</a></li>
                    <li><a href="#" onclick="logout()" class="btn-login" style="background: #ef4444;"><i class="fas fa-sign-out-alt"></i> خروج</a></li>
                </ul>
            </nav>
            
            <div class="hamburger" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- ====== نموذج إضافة المنتج ====== -->
    <section class="admin-form-section">
        <div class="container">
            <div class="form-container">
                <h2 class="section-title"><i class="fas fa-plus-circle" style="color: #7c3aed;"></i> إضافة منتج جديد</h2>
                
                <form id="add-product-form" onsubmit="handleAddProduct(event)" enctype="multipart/form-data">
                    <div class="form-grid">
                        <!-- اسم المنتج -->
                        <div class="form-group">
                            <label>اسم المنتج <span class="required">*</span></label>
                            <input type="text" id="product-name" placeholder="مثال: قميص قطني كلاسيك" required>
                        </div>
                        
                        <!-- القسم -->
                        <div class="form-group">
                            <label>القسم <span class="required">*</span></label>
                            <select id="product-category" required>
                                <option value="">اختر القسم</option>
                                <option value="shirts">👕 القمصان</option>
                                <option value="pants">👖 السراويل</option>
                                <option value="shoes">👟 الأحذية</option>
                                <option value="underwear">🩲 الملابس الداخلية</option>
                                <option value="socks">🧦 الجوارب</option>
                            </select>
                        </div>
                        
                        <!-- السعر -->
                        <div class="form-group">
                            <label>السعر (دج) <span class="required">*</span></label>
                            <input type="number" id="product-price" placeholder="مثال: 250" min="0" required>
                        </div>
                        
                        <!-- المقاس -->
                        <div class="form-group">
                            <label>المقاس <span class="required">*</span></label>
                            <select id="product-size" required>
                                <option value="">اختر المقاس</option>
                                <option value="S">S</option>
                                <option value="M">M</option>
                                <option value="L">L</option>
                                <option value="XL">XL</option>
                                <option value="XXL">XXL</option>
                                <option value="One Size">One Size</option>
                            </select>
                        </div>
                        
                        <!-- الكمية -->
                        <div class="form-group">
                            <label>الكمية في المخزون <span class="required">*</span></label>
                            <input type="number" id="product-stock" placeholder="مثال: 15" min="0" required>
                        </div>
                        
                        <!-- صورة المنتج -->
                        <div class="form-group">
                            <label>صورة المنتج <span class="required">*</span></label>
                            <div class="file-upload">
                                <input type="file" id="product-image" accept="image/*" required>
                                <label for="product-image" class="file-label">
                                    <i class="fas fa-cloud-upload-alt"></i>
                                    <span>اختر صورة</span>
                                </label>
                                <div id="image-preview" class="image-preview"></div>
                            </div>
                        </div>
                        
                        <!-- الوصف -->
                        <div class="form-group full-width">
                            <label>وصف المنتج</label>
                            <textarea id="product-description" rows="4" placeholder="أدخل وصفاً مفصلاً للمنتج..."></textarea>
                        </div>
                    </div>
                    
                    <div class="form-actions">
                        <button type="submit" class="btn-primary">
                            <i class="fas fa-save"></i> نشر المنتج
                        </button>
                        <button type="reset" class="btn-secondary">
                            <i class="fas fa-undo"></i> إعادة تعيين
                        </button>
                        <a href="dashboard.html" class="btn-secondary">
                            <i class="fas fa-arrow-right"></i> العودة
                        </a>
                    </div>
                </form>
            </div>
        </div>
    </section>

    <script src="../js/main.js"></script>
    <script src="../js/auth.js"></script>
    <script src="../js/admin.js"></script>
</body>
</html>
