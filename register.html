<!DOCTYPE html>
<html lang="ar" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>إنشاء حساب - ORIBAD</title>
    <link rel="stylesheet" href="css/style.css">
    <link rel="stylesheet" href="css/auth.css">
    <link rel="stylesheet" href="css/responsive.css">
    <link href="https://fonts.googleapis.com/css2?family=Playfair+Display:wght@700;900&family=Tajawal:wght@400;700;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.5.0/css/all.min.css">
</head>
<body>
    <!-- ====== الهيدر ====== -->
    <header>
        <div class="container header-container">
            <div class="logo-banner">
                <h1 class="logo-text">ORIBAD</h1>
                <span class="logo-sub">أوريباد</span>
            </div>
            
            <nav>
                <ul class="nav-links">
                    <li><a href="index.html">الرئيسية</a></li>
                    <li><a href="categories.html">الأقسام</a></li>
                    <li><a href="cart.html">🛒 السلة <span id="cart-count" class="cart-badge">0</span></a></li>
                    <li><a href="notifications.html">🔔 <span id="notif-count" class="notif-badge">0</span></a></li>
                    <li><a href="login.html" class="btn-login">تسجيل الدخول</a></li>
                </ul>
            </nav>
            
            <div class="hamburger" onclick="toggleMenu()">
                <i class="fas fa-bars"></i>
            </div>
        </div>
    </header>

    <!-- ====== نموذج إنشاء حساب ====== -->
    <section class="auth-section">
        <div class="container">
            <div class="auth-container">
                <div class="auth-box">
                    <div class="auth-header">
                        <div class="logo-banner" style="margin-bottom: 20px;">
                            <h1 class="logo-text" style="font-size: 1.8rem;">ORIBAD</h1>
                        </div>
                        <h2>إنشاء حساب جديد 🎉</h2>
                        <p>انضم إلينا واستمتع بتجربة تسوق مميزة</p>
                    </div>
                    
                    <form id="register-form" onsubmit="handleRegister(event)">
                        <div class="form-group">
                            <label>اسم المستخدم</label>
                            <div class="input-wrapper">
                                <i class="fas fa-user"></i>
                                <input type="text" id="reg-username" placeholder="اختر اسم مستخدم" required>
                            </div>
                            <div id="username-error" class="error-message" style="display: none;">
                                <i class="fas fa-exclamation-circle"></i> اسم المستخدم مستخدم بالفعل
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>البريد الإلكتروني</label>
                            <div class="input-wrapper">
                                <i class="fas fa-envelope"></i>
                                <input type="email" id="reg-email" placeholder="أدخل بريدك الإلكتروني" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label>كلمة المرور</label>
                            <div class="input-wrapper">
                                <i class="fas fa-lock"></i>
                                <input type="password" id="reg-password" placeholder="أدخل كلمة المرور" required minlength="6">
                                <i class="fas fa-eye toggle-password" onclick="togglePassword(this)"></i>
                            </div>
                            <div class="password-hint">يجب أن تكون كلمة المرور 6 أحرف على الأقل</div>
                        </div>
                        
                        <div class="form-group">
                            <label>تأكيد كلمة المرور</label>
                            <div class="input-wrapper">
                                <i class="fas fa-check"></i>
                                <input type="password" id="reg-password-confirm" placeholder="أعد كتابة كلمة المرور" required>
                            </div>
                        </div>
                        
                        <div class="form-group">
                            <label class="checkbox-label">
                                <input type="checkbox" id="terms-check" required>
                                <span>أوافق على <a href="#" class="terms-link">الشروط والأحكام</a></span>
                            </label>
                        </div>
                        
                        <button type="submit" class="btn-submit">
                            <i class="fas fa-user-plus"></i> إنشاء حساب
                        </button>
                    </form>
                    
                    <div class="auth-footer">
                        <p>لديك حساب بالفعل؟ <a href="login.html">تسجيل الدخول</a></p>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <script src="js/main.js"></script>
    <script src="js/auth.js"></script>
</body>
</html>
